<div class="flex min-h-screen flex-col items-center justify-center bg-linear-to-br from-indigo-50 via-white to-purple-50 px-4 py-12">
  <div class="card card-border w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <div class="card-body space-y-6">
      <div>
        <h1 class="text-center font-bold text-3xl">
          Create Account
        </h1>
        <p class="text-center text-gray-600">
          Sign up to start finding retail spaces
        </p>
      </div>
      <form method="post" action="/auth" class="space-y-6" data-discover="true">
        <fieldset class="fieldset">
          <div>
            <label for="_r_0_" class="label">
              Full Name
            </label>
            <input class="input input-lg w-full" id="_r_0_" name="name" placeholder="John Doe" required="" type="text">
          </div>
          <label for="_r_1_" class="label">
            Email Address
          </label>
          <input class="input input-lg w-full" id="_r_1_" name="email" placeholder="you@example.com" required="" style="" type="email">
          <label for="_r_2_" class="fieldset-label">
            Password
          </label>
          <input class="input input-lg w-full" id="_r_2_" minlength="8" name="password" placeholder="••••••••" required="" style="" type="password">
          <p class="fieldset-legend">
            Must be at least 8 characters
          </p>
        </fieldset>
        <button class="btn btn-primary mt-4 flex w-full items-center justify-center gap-2" name="isSignUp" type="submit" value="true">
          Create Account
        </button>
      </form>
    </div>
    <div class="card-action text-center">
      <button class="btn btn-link" type="button">
        Already have an account? Sign in
      </button>
    </div>
  </div>
  <footer class="mt-8 text-center text-gray-600 text-sm">
    By signing up, you agree to our
    <a href="/terms" class="link">
      Terms of Service
    </a>
    and
    <a href="/privacy" class="link">
      Privacy Policy
    </a>
  </footer>
</div>
