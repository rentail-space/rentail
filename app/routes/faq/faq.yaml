- category: "Getting Started"
  questions:
    - question: "How does rentail.space work?"
      answer: "Rentail.space connects micro-merchants with short-term retail spaces in shopping centers. Simply chat with our AI to find spaces that match your needs, book your preferred space, and start selling. We handle all the paperwork and payment processing."

- category: "Pricing & Payments"
  questions:
    - question: "How much does it cost to use rentail.space?"
      answer: "Nothing! We don't charge any fees to use our service. You only pay the rental cost for the space, utility bills, etc. We don't charge you any transaction fees or booking fees."
    - question: "What payment methods do you accept?"
      answer: "We accept all major credit cards (Visa, MasterCard, American Express, Discover) and bank transfers. All payments are processed securely through our platform."
    - question: "Can I get a refund?"
      answer: "Refund policies vary by property and are agreed upon at booking. Generally, cancellations made 7+ days before your start date are eligible for refunds. Check specific terms when booking."

- category: "Booking & Spaces"
  questions:
    - question: "How far in advance should I book?"
      answer: "It varies by location and season. Popular locations during holidays book months in advance, while other times you might find same-day availability. We recommend booking 2-4 weeks ahead when possible."
    - question: "What's included with the space?"
      answer: "Basic utilities (electricity, Wi-Fi) are typically included. Specific amenities vary by location. You'll see all included features in the space listing before booking."
    - question: "Can I extend my rental period?"
      answer: "Yes, subject to availability. Contact the property manager through our platform to request an extension. Many merchants start with a short period and extend if sales go well."

- category: "Support & Account"
  questions:
    - question: "What if I have issues during my rental?"
      answer: "Contact the property manager to report any issues. They'll help you resolve the issue as soon as possible."
    - question: "How does the AI recommendation system work?"
      answer: "Our AI analyzes your business type, budget, target market, and foot traffic needs to suggest the best-fit spaces. It learns from successful bookings to improve recommendations over time."
