allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true

allowedDeprecatedVersions:
  - glob@>=10.3.7 <10.5.0

ignoredBuiltDependencies:
  - yarn

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "coolify-ghcr-deploy"

onlyBuiltDependencies:
  - "@infisical/cli"
  - "@prisma/client"
  - "@prisma/engines"
  - "@sentry/cli"
  - "@tailwindcss/oxide"
  - core-js
  - esbuild
  - msw
  - prisma
  - protobufjs
  - sharp

patchedDependencies:
  "@opentelemetry/api@1.9.1": patches/@opentelemetry__api@1.9.1.patch
  "@opentelemetry/semantic-conventions@1.41.1": patches/@opentelemetry__semantic-conventions@1.41.1.patch
