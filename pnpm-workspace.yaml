allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true

allowedDeprecatedVersions:
  glob: ">=10.3.7 <10.5.0"

ignoredBuiltDependencies:
  - yarn

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vercel/*"
  - vercel
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - core-js
  - esbuild
  - msw
  - prisma
  - protobufjs
  - sharp
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
