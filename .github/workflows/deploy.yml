name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentail_test
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: false
          run_install: true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright and system dependencies
        run: pnpm exec playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Get test secrets
        uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "test"
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}

      - name: Setup database schema for testing
        run: |
          pnpm prisma generate
          pnpm prisma db push

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Generate React Router types
        run: pnpm exec react-router typegen

      - name: Check code/types/formatting
        run: pnpm exec vp check

      - name: Run Tests
        run: |
          pnpm vp test run

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: __screenshots__

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Get production secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          export-type: "file"
          file-output-path: "/.env"
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}

      - uses: mxschmitt/action-tmate@v3
        if: false

      - name: Deploy to Coolify
        uses: assaf/coolify-deploy@d5bf2501ddf14c56437ac44e4f5c598db0d853d7
        with:
          app-name: rentail.space
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          coolify-url: https://coolify.labnotes.org
          env-file: ".env"
          healthcheck-path: /health
          healthcheck-timeout: 120
          image: ghcr.io/rentail-space/rentail:latest
