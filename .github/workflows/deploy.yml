name: Deploy

on:
  - push
  - workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Configure PNPM/Playwright cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            playwright
            pnpm

      - name: Install NPM dependencies
        run: pnpm install

      - name: Set PLAYWRIGHT_VERSION
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version)" >> $GITHUB_ENV

      - name: Install Playwright (Chromium)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium --with-deps

      - name: Setup database schema for testing
        run: |
          pnpm prisma generate 
          pnpm prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          NODE_ENV: "test"

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Lint code
        run: biome lint

      - name: Generate React Router types
        run: pnpm react-router typegen

      - name: Check types
        run: pnpm tsc --noEmit --strict
        env:
          NODE_OPTIONS: "--max-old-space-size=2096"

      - name: Run Tests
        run: pnpm vitest run
        env:
          ANTHROPIC_API_KEY: "***REMOVED***"
          BETTER_AUTH_SECRET: "***REMOVED***"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DEBUG: ""
          NODE_OPTIONS: "--expose-gc --max-old-space-size=2096"
          REDIS_URL: "redis://localhost:6379"
          RESEND_API_KEY: "re_"

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: __screenshots__

      - name: Upload Playwright screenshots
        uses: namespace-actions/upload-artifact@v1
        with:
          name: playwright-screenshots
          path: __screenshots__/

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Update database
        run: |
          doppler run --config prd -- pnpm prisma db push
          doppler run --config prd -- pnpm prisma db seed
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Deploy to Vercel
        uses: nexterias/actions-vercel@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          org-id: "team_bjyg9pgn8TQQVP2NLMPnSYSN"
          prebuilt: false
          production: false
          project-id: "prj_SrqYHd1Olo0XfxQHLe9lyGfcoT9z"
          token: ${{ secrets.VERCEL_TOKEN }}
        env:
          SENTRY_AUTH_TOKEN: "***REMOVED***"
          SENTRY_ORG: "labnotes"
          SENTRY_PROJECT: "rentail"
