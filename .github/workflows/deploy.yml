name: Deploy

on:
  - push
  - workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: Install NPM dependencies
        run: pnpm install

      - name: Set PLAYWRIGHT_VERSION
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version)" >> $GITHUB_ENV

      - name: Install Playwright (Chromium)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium --with-deps

      - name: Setup database schema for testing
        run: |
          pnpm prisma generate 
          pnpm prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          NODE_ENV: "test"

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Generate React Router types
        run: pnpm react-router typegen

      - name: Check code/types/formatting
        run: pnpm exec vp check

      - name: Run Tests
        if: false
        run: pnpm test
        env:
          ANTHROPIC_API_KEY: "***REMOVED***"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DEBUG: ""
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          OPENAI_API_KEY: "***REMOVED***"
          REDIS_URL: "redis://localhost:6379"
          RESEND_API_KEY: "re_"
          SESSION_SECRET: "secret"

      - name: Upload Playwright Test Results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: __screenshots__

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Update database
        if: github.ref == 'refs/heads/main'
        run: |
          doppler run --config prd -- pnpm prisma db push
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Deploy to Coolify
        if: github.ref == 'refs/heads/main'
        run: |
          doppler run --config prd -- bash -c '
            curl -s -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "https://coolify.labnotes.org/api/v1/deploy?uuid=s4jrdxemxqqk1v1ryvyurdm5&force=true"
          '
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
