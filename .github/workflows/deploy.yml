name: Deploy

on:
  - push
  - workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: "***REMOVED***"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      REDIS_URL: "redis://localhost:6379"
      RESEND_API_KEY: "re_1234567890"
      SESSION_SECRET: "***REMOVED***"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - id: cache-node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install NPM dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install

      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Set PLAYWRIGHT_VERSION
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version)" >> $GITHUB_ENV

      - id: cache-playwright
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers — Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - run: biome lint

      - name: Setup PostgreSQL (for testing)
        id: postgres
        uses: nyurik/action-setup-postgis@v2.2
        with:
          postgres-version: "17"

      - name: Setup database schema (for testing)
        run: |
          pnpm dlx prisma generate 
          pnpm dlx prisma db push
          pnpm dlx prisma db seed
        env:
          NODE_ENV: "test"

      - name: Start Redis (for testing)
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: 5

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Clear Vite cache
        run: pnpm clean

      - name: Generate React Router types
        run: pnpm react-router typegen

      - name: Check types
        uses: iCrawl/action-tsc@v1

      - name: Run Tests
        run: pnpm vitest run --reporter verbose test/auth.test.ts
        env:
          DEBUG: "server"

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      SENTRY_AUTH_TOKEN: "***REMOVED***"
      SENTRY_ORG: "labnotes"
      SENTRY_PROJECT: "rentail"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Deploy Prisma schema
        run: |
          doppler run --config prd -- pnpm dlx prisma db push

      - name: Deploy to Vercel
        uses: nexterias/actions-vercel@v1
        with:
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          prebuilt: false
          production: ${{ github.ref == 'refs/heads/main' }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
