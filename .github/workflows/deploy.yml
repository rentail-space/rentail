name: Deploy


on:
  - push
  - workflow_dispatch

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Restore or cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install NPM dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci


      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').dependencies['@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers — Chromium
        # if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Browsers - Depencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps


      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Setup PostgreSQL (for testing)
        uses: ikalnytskyi/action-setup-postgres@v7
        with:
          postgres-version: "16"

      - name: Setup Prisma (for testing)
        run: npx prisma db push && npx prisma db seed
        env:
          NODE_ENV: "test"

      - name: Start Redis (for testing)
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: 5


      - name: Run Tests
        run: npm run test
        env:
          ANTHROPIC_API_KEY: "***REMOVED***"
          NODE_ENV: "test"
          SESSION_SECRET: "***REMOVED***"
          RESEND_API_KEY: "re_1234567890"

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: "***REMOVED***"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Deploy Prisma schema
        run: doppler run --config prd -- npx prisma db push

      - name: Deploy database migrations
        run: doppler run --config prd -- npx prisma migrate deploy

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: --environment=production
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID}}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID}}
