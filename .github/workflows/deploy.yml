name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35

    env:
      # Test database + Redis come from the service containers; the remaining
      # test secrets come from GitHub Actions secrets (RESEND_API_KEY,
      # SESSION_SECRET). This mirrors what .env.test provides locally.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentail_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rentail_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentail_test
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: false
          install: true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright and system dependencies
        run: pnpm exec playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Setup database schema for testing
        run: |
          pnpm prisma generate
          pnpm prisma db push

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Generate React Router types
        run: pnpm exec react-router typegen

      - name: Check code/types/formatting
        run: pnpm exec vp check

      - name: Run Tests
        run: |
          pnpm vp test run

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: __screenshots__

      - name: Deploy to Vercel
        run: |
          pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
