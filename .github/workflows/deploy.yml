name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  INFISICAL_WORKSPACE: "066b245d-5428-40f4-b0d4-aee38c8f8cea"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm store path | xargs rm -rf && pnpm install --frozen-lockfile

      - name: Install Playwright and system dependencies
        run: pnpm exec playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Get test secrets
        uses: Infisical/secrets-action@v1.0.9
        with:
          client_id: "***REMOVED***"
          client_secret: "***REMOVED***"
          env_slug: "test"
          project_slug: "rentail-2h3s"

      - name: Secrets 1
        run: |
          cat ".env"

      - name: Setup database schema for testing
        run: |
          pnpm prisma generate
          pnpm prisma db push

      - name: Check secrets
        run: pnpm secretlint "**/*" --format stylish

      - name: Generate React Router types
        run: pnpm react-router typegen

      - name: Check code/types/formatting
        run: pnpm exec vp check

      - name: Run Tests
        run: rm -rf __screenshots__ && pnpm --expose-gc --max-old-space-size=3096 vp test run

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: __screenshots__

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get production secrets
        uses: zerodays/action-infisical@v1
        with:
          environment: "prod"
          infisical_token: ${{ secrets.INFISICAL_TOKEN }}
          workspace_id: ${{ env.INFISICAL_WORKSPACE }}

      - name: Read env file for Docker build
        id: env-file
        run: |
          VALUE=$(cat echo)
          echo "::add-mask::$VALUE"
          echo "env=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Secrets
        run: |
          echo ${{ steps.env-file.outputs.env }}

      - name: Deploy to Coolify
        uses: assaf/coolify-deploy@v1.2.0
        with:
          image: ghcr.io/rentail-space/rentail:latest
          app-name: rentail.space
          coolify-url: https://coolify.labnotes.org
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          env-vars: ${{ steps.env-file.outputs.env }}
          healthcheck-path: /health
          healthcheck-timeout: 120
